name: Umbrella browser preview
on: [pull_request,workflow_dispatch]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/build.sh
      - run: npm install --no-save playwright-core@1.56.1
      - run: mkdir -p /tmp/umbrella-preview && ln -s "$PWD/dist" /tmp/umbrella-preview/last-umbrella && python3 -m http.server 4180 -d /tmp/umbrella-preview >/tmp/umbrella.log 2>&1 &
      - run: node tools/test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: umbrella-browser-preview
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: umbrella-review-frames
          path: frames
